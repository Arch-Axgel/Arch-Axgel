  <text x="24" y="36" font-size="13" xml:space="preserve"><tspan class="fg" font-weight="700">arch@angel</tspan><tspan class="mute">:~$</tspan><tspan class="fg"> ./featured</tspan></text>
  <text x="24" y="68" font-size="22" font-weight="700" xml:space="preserve"><tspan class="fg">Angel.</tspan><tspan class="mute"> The bratty diva who runs your server.</tspan></text>

