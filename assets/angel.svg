    .fg { fill: #eef6ff; } .dim { fill: #b3c3d6; } .mute { fill: #8597ad; } .faint { fill: #4f5d73; } .acc { fill: #a8dcff; }
    .art { font-size: 11px; fill: #6aaee0; }
    .row { font-size: 13px; }
    .a { animation: fa 1.8s steps(1) infinite; }
    .b { opacity: 0; animation: fb 1.8s steps(1) infinite; }
    @keyframes fa { 50% { opacity: 0; } }
    @keyframes fb { 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .a, .b { animation: none; } }
  </style>
