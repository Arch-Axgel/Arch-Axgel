<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 296" width="840" height="296" role="img" aria-labelledby="t d">
  <title id="t">Featured project: Angel</title>
  <desc id="d">Angel, the bratty diva who runs your server. An all-in-one Discord bot: moderation, AI orders, economy, levels, games and pets, music, a ticket desk and a web dashboard at archie.nxtr.in.</desc>
