<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="840" height="440" role="img" aria-labelledby="t d">
  <title id="t">Arch (Arch-Axgel)</title>
  <desc id="d">Terminal-style profile card. Arch makes Angel, an all-in-one Discord bot. Stack: Python, Red-DiscordBot, PostgreSQL. Dashboard at archie.nxtr.in.</desc>
  <style>
    text { font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
    .p { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
    .fg { fill: #eef6ff; } .dim { fill: #b3c3d6; } .mute { fill: #8597ad; } .faint { fill: #4f5d73; }
    .acc { fill: #a8dcff; } .ok { fill: #7fd99a; }
    .lbl { font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; }
    .term { font-size: 13px; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    .ln { opacity: 0; animation: show 0.2s ease-out forwards; }
    .l1 { animation-delay: 1.1s; } .l2 { animation-delay: 1.4s; } .l3 { animation-delay: 1.7s; }
    .l4 { animation-delay: 2.0s; } .l5 { animation-delay: 2.3s; } .l6 { animation-delay: 2.8s; }
    .cover { transform-box: fill-box; transform-origin: right center; animation: type 0.8s steps(16, end) 0.2s forwards; }
    @keyframes blink { 50% { fill-opacity: 0; } }
    @keyframes show { to { opacity: 1; } }
    @keyframes type { to { transform: scaleX(0); } }
    @media (prefers-reduced-motion: reduce) {
      .blink, .ln, .cover { animation: none; }
      .ln { opacity: 1; }
      .cover { display: none; }
    }
  </style>
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#1c2536"/>
    </pattern>
  </defs>

  <!-- frame -->
  <rect x="0.5" y="0.5" width="839" height="439" rx="3" fill="#05070c" stroke="#2b3850"/>
  <rect x="1" y="1" width="838" height="438" rx="3" fill="url(#dots)"/>

  <!-- title bar -->
  <text x="24" y="21" font-size="12" class="mute">arch@github: ~/Arch-Axgel</text>
  <text x="816" y="21" font-size="12" class="mute" text-anchor="end">tty1 · utf-8</text>
  <rect x="1" y="32" width="838" height="1" fill="#1c2536"/>

  <!-- hero, left column -->
  <text x="24" y="70" class="lbl" xml:space="preserve"><tspan class="mute">~/ </tspan><tspan class="fg">MAKER OF ANGEL</tspan></text>
  <text x="24" y="142" font-size="64" xml:space="preserve"><tspan class="mute" font-weight="400">&gt; </tspan><tspan class="fg" font-weight="700">Arch</tspan><tspan class="acc blink" font-weight="700">_</tspan></text>
  <text x="24" y="182" font-size="15" font-weight="500" class="fg">I make Discord bots with too much attitude.</text>
  <rect x="24" y="198" width="2" height="22" fill="#2b3850"/>
  <text x="36" y="214" font-size="14" class="p dim">"Obviously she's the best bot here. I just wrote her."</text>
  <text x="24" y="246" font-size="14.5" class="p dim">Building Angel: moderation, economy, levels, games, pets,</text>
  <text x="24" y="268" font-size="14.5" class="p dim">music and a ticket desk, with a full web dashboard.</text>

  <!-- terminal box -->
  <rect x="470.5" y="56.5" width="345" height="216" rx="2" fill="#020306" stroke="#2b3850"/>
  <rect x="470" y="56" width="2" height="217" fill="#a8dcff"/>
  <text x="488" y="86" font-size="18" font-weight="700"><tspan class="fg">arch</tspan><tspan class="mute" font-weight="400">~</tspan><tspan class="acc blink">█</tspan></text>

  <text x="488" y="114" class="term dim" xml:space="preserve"><tspan class="mute">$</tspan> whoami --verbose</text>
  <rect class="cover" x="502" y="101" width="150" height="18" fill="#020306"/>

  <g class="term">
    <g class="ln l1"><text x="488" y="136" class="ok">[ ok ]</text><text x="543" y="136" class="dim">name</text><text x="621" y="136" class="dim">arch</text></g>
    <g class="ln l2"><text x="488" y="158" class="ok">[ ok ]</text><text x="543" y="158" class="dim">alias</text><text x="621" y="158" class="dim">Arch-Axgel</text></g>
    <g class="ln l3"><text x="488" y="180" class="ok">[ ok ]</text><text x="543" y="180" class="dim">building</text><text x="621" y="180" class="dim">angel</text></g>
    <g class="ln l4"><text x="488" y="202" class="ok">[ ok ]</text><text x="543" y="202" class="dim">stack</text><text x="621" y="202" class="dim">python · postgres</text></g>
    <g class="ln l5"><text x="488" y="224" class="ok">[ ok ]</text><text x="543" y="224" class="dim">attitude</text><text x="621" y="224" class="dim">inherited</text></g>
    <g class="ln l6"><text x="488" y="250" class="dim">ready. say hi<tspan class="mute blink">█</tspan></text></g>
  </g>

  <!-- stat strip -->
  <rect x="24.5" y="296.5" width="791" height="92" rx="2" fill="#0a0e16" stroke="#2b3850"/>
  <rect x="222" y="297" width="1" height="91" fill="#1c2536"/>
  <rect x="420" y="297" width="1" height="91" fill="#1c2536"/>
  <rect x="618" y="297" width="1" height="91" fill="#1c2536"/>

  <text x="42" y="322" class="lbl mute">BUILDING</text>
  <text x="42" y="352" font-size="22" font-weight="700" class="fg">Angel</text>
  <text x="42" y="373" font-size="12.5" class="p mute">all-in-one Discord bot</text>

  <text x="240" y="322" class="lbl mute">STACK</text>
  <text x="240" y="352" font-size="22" font-weight="700" class="fg">Python</text>
  <text x="240" y="373" font-size="12.5" class="p mute">Red-DiscordBot, PostgreSQL</text>

  <text x="438" y="322" class="lbl mute">PREFIX</text>
  <text x="438" y="352" font-size="22" font-weight="700" class="fg">;</text>
  <text x="438" y="373" font-size="12.5" class="p mute">try ;help</text>

  <circle cx="639" cy="318" r="3" fill="#7fd99a"/>
  <text x="648" y="322" class="lbl mute">STATUS</text>
  <text x="636" y="352" font-size="22" font-weight="700" class="fg">online</text>
  <text x="636" y="373" font-size="12.5" class="p mute">archie.nxtr.in</text>

  <!-- status line -->
  <rect x="1" y="408" width="838" height="31" fill="#0e1420"/>
  <rect x="1" y="408" width="838" height="1" fill="#1c2536"/>
  <rect x="1" y="409" width="64" height="30" fill="#eef6ff"/>
  <text x="11" y="428" font-size="12" font-weight="700" fill="#04101a">[arch]</text>
  <text x="76" y="428" font-size="12" class="acc">~*</text>
  <text x="816" y="428" font-size="12" text-anchor="end" xml:space="preserve"><tspan class="dim">utf-8</tspan><tspan class="faint">  |  </tspan><tspan class="dim">prefix ;</tspan><tspan class="faint">  |  </tspan><tspan class="dim">made by arch</tspan></text>
</svg>
